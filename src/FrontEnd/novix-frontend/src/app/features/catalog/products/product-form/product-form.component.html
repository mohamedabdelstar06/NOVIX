<div class="product-form-container">
    <h3>New Product</h3>

    <form #productForm="ngForm" (ngSubmit)="save(productForm)">
        <div class="form-group">
            <label for="name">Product Name <span class="required-asterisk">*</span></label>
            <input id="name" name="name" type="text" pInputText class="input-field" [(ngModel)]="product.name" required #nameRef="ngModel" [ngClass]="{'ng-dirty ng-invalid': nameRef.invalid && (nameRef.dirty || productForm.submitted)}">
            <small class="error-text" *ngIf="nameRef.invalid && (nameRef.dirty || productForm.submitted)">Product Name is required.</small>
        </div>

        <div class="form-group">
            <label for="category">Category <span class="required-asterisk">*</span></label>
            <p-dropdown id="category" name="category" [options]="categories" [(ngModel)]="product.categoryId" placeholder="Select a Category" class="input-field" styleClass="w-full" required #categoryRef="ngModel" [ngClass]="{'ng-dirty ng-invalid': categoryRef.invalid && (categoryRef.dirty || productForm.submitted)}"></p-dropdown>
            <small class="error-text" *ngIf="categoryRef.invalid && (categoryRef.dirty || productForm.submitted)">Category is required.</small>
        </div>

        <div class="form-group">
            <label for="brand">Brand <span class="required-asterisk">*</span></label>
            <p-dropdown id="brand" name="brand" [options]="brands" [(ngModel)]="product.brandId" placeholder="Select a Brand" class="input-field" styleClass="w-full" required #brandRef="ngModel" [ngClass]="{'ng-dirty ng-invalid': brandRef.invalid && (brandRef.dirty || productForm.submitted)}"></p-dropdown>
            <small class="error-text" *ngIf="brandRef.invalid && (brandRef.dirty || productForm.submitted)">Brand is required.</small>
        </div>

        <div class="form-group">
            <label for="price">Base Price <span class="required-asterisk">*</span></label>
            <p-inputNumber id="price" name="price" [(ngModel)]="product.basePrice" mode="currency" currency="USD" locale="en-US" class="input-field" styleClass="w-full" [required]="true" #priceRef="ngModel" [ngClass]="{'ng-dirty ng-invalid': priceRef.invalid && (priceRef.dirty || productForm.submitted)}"></p-inputNumber>
            <small class="error-text" *ngIf="priceRef.invalid && (priceRef.dirty || productForm.submitted)">Base Price must be a valid number.</small>
        </div>

        <div class="form-group">
            <label class="block mb-2">Product Image</label>
            <label for="image" class="p-button p-component p-button-outlined cursor-pointer inline-flex align-items-center gap-2">
                <i class="pi pi-upload"></i>
                <span class="p-button-label">Choose Image</span>
            </label>
            <input type="file" id="image" class="hidden" (change)="onImageUpload($event)" accept="image/*">
            <div *ngIf="localImagePreview || product.imageUrl" class="mt-3">
                <img [src]="localImagePreview || product.imageUrl" alt="Product Image" class="shadow-2 border-round" style="max-width: 200px; height: auto;">
            </div>
        </div>

        <div class="form-group flex align-items-center gap-3">
            <label for="published" class="mb-0">Publish Product</label>
            <p-inputSwitch id="published" name="isPublished" [(ngModel)]="product.isPublished"></p-inputSwitch>
            <small class="text-gray-500">If enabled, the product will be visible to customers.</small>
        </div>

        <div class="form-actions">
            <button type="button" pButton label="Cancel" class="p-button-text p-button-secondary" routerLink="/products" [disabled]="isSaving"></button>
            <button type="submit" pButton [label]="isSaving ? 'Saving...' : 'Save Product'" [icon]="isSaving ? 'pi pi-spin pi-spinner' : 'pi pi-check'" class="p-button-primary" [disabled]="isSaving"></button>
        </div>
    </form>
</div>
