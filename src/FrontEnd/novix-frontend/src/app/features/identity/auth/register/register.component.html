<div class="auth-form">
    <form (ngSubmit)="register()" #registerForm="ngForm">
        <div class="form-row">
            <div class="form-group form-col">
                <label for="firstname">First Name</label>
                <input id="firstname" type="text" pInputText class="input-field" [(ngModel)]="user.firstName" name="firstname" required>
            </div>
            <div class="form-group form-col">
                <label for="lastname">Last Name</label>
                <input id="lastname" type="text" pInputText class="input-field" [(ngModel)]="user.lastName" name="lastname" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" pInputText class="input-field" [(ngModel)]="user.email" name="email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <p-password id="password" [(ngModel)]="user.password" name="password" [toggleMask]="true" styleClass="input-field" [inputStyle]="{'width':'100%'}" required></p-password>
        </div>

        <button pButton label="Sign Up" icon="pi pi-user-plus" class="submit-btn" type="submit" [disabled]="registerForm.invalid || isLoading" [loading]="isLoading"></button>

        <div class="divider">
            <span>OR</span>
        </div>

        <button pButton label="Sign Up with Google" icon="pi pi-google" class="google-btn p-button-outlined p-button-secondary" type="button" (click)="googleRegister()" [loading]="isGoogleLoading"></button>

        <div class="footer">
            <span>Already have an account?</span>
            <a routerLink="/auth/login">Sign in</a>
        </div>
    </form>
</div>
