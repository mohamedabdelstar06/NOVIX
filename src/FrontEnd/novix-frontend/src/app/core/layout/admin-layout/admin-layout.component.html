<div class="admin-layout-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="pi pi-box logo-icon"></i>
            <span class="logo-text">NOVIX</span>
        </div>
        
        <div class="sidebar-content">
            <div class="menu-section-label">Catalog</div>
            <ul class="menu-list">
                <li class="menu-item">
                    <a routerLink="/admin/products" routerLinkActive="active-link" class="menu-link">
                        <i class="pi pi-box"></i>
                        <span>Products</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a routerLink="/admin/brands" routerLinkActive="active-link" class="menu-link">
                        <i class="pi pi-tags"></i>
                        <span>Brands</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a routerLink="/admin/categories" routerLinkActive="active-link" class="menu-link">
                        <i class="pi pi-sitemap"></i>
                        <span>Categories</span>
                    </a>
                </li>
            </ul>

            <div class="menu-section-label">Settings</div>
            <ul class="menu-list">
                <li class="menu-item">
                    <a routerLink="/admin/settings" routerLinkActive="active-link" class="menu-link">
                        <i class="pi pi-cog"></i>
                        <span>General Settings</span>
                    </a>
                </li>
            </ul>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <div class="breadcrumb-area">
                <i class="pi pi-home"></i>
                <i class="pi pi-chevron-right separator"></i>
                <span>Catalog</span>
                <i class="pi pi-chevron-right separator"></i>
                <span class="current">Dashboard</span>
            </div>
            
            <div class="actions-area">
                <button class="action-btn" title="Search (Ctrl+K)">
                    <i class="pi pi-search"></i>
                </button>
                <button class="action-btn" title="Toggle Theme" (click)="toggleTheme()">
                    <i class="pi" [ngClass]="isDarkTheme ? 'pi-sun' : 'pi-moon'"></i>
                </button>
                <button class="action-btn" title="Notifications">
                    <i class="pi pi-bell"></i>
                </button>

                <div class="user-profile">
                    <div class="avatar">A</div>
                    <span>Admin User</span>
                    <i class="pi pi-angle-down text-sm text-muted"></i>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="content-area">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>

<p-toast></p-toast>
<p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>
