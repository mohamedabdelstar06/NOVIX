<div class="customer-layout-container">
    <nav class="navbar">
        <a routerLink="/" class="brand-logo">
            <i class="pi pi-box"></i>
            NOVIX
        </a>

        <div class="search-bar">
            <div class="p-inputgroup">
                <span class="p-inputgroup-addon"><i class="pi pi-search"></i></span>
                <input type="text" pInputText placeholder="Search for products, categories..." [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" />
                <button type="button" pButton label="Search" (click)="onSearch()"></button>
            </div>
        </div>

        <div class="nav-actions">
            <a class="nav-link">Discover</a>
            <a class="nav-link">Rewards</a>
            <a routerLink="/auth/login" class="nav-link">Sign In</a>
            <i class="pi pi-heart nav-icon"></i>
            <i class="pi pi-shopping-cart nav-icon"></i>
        </div>
    </nav>

    <main class="main-content">
        <router-outlet></router-outlet>
    </main>

    <footer class="footer">
        <div class="footer-grid">
            <div class="footer-col">
                <h4>About NOVIX</h4>
                <ul>
                    <li>About Us</li>
                    <li>Careers</li>
                    <li>Press</li>
                </ul>
            </div>
            <div class="footer-col">
                <h4>Customer Service</h4>
                <ul>
                    <li>Help Center</li>
                    <li>Returns & Refunds</li>
                    <li>Contact Us</li>
                </ul>
            </div>
            <div class="footer-col">
                <h4>Explore</h4>
                <ul>
                    <li>Write a Review</li>
                    <li>Join Rewards</li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 NOVIX E-Commerce. All rights reserved.
        </div>
    </footer>
</div>
